<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo-Vélo Vietnam : La Grande Balade !</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #0f172a;
        }

        .font-arcade {
            font-family: 'Fredoka', sans-serif;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.95); opacity: 0.85; }
            100% { transform: scale(1.45); opacity: 0; }
        }
        .bell-pulse::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 9999px;
            border: 3px solid #facc15;
            animation: pulseRing 0.55s ease-out forwards;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.7);
        }

        .touch-btn {
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.08s ease, background-color 0.12s ease;
        }
        .touch-btn:active {
            transform: scale(0.92);
        }
    </style>
</head>

    <script>
    // --- 1. SYNTHÉTISEUR AUDIO WEB AUDIO API + VOIX D'ACCUEIL ---
    class SoundEngine {
        constructor() {
            this.ctx = null;
            this.muted = false;
            this.bgmTimer = null;
            this.noteStep = 0;
        }

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    this.ctx = new AudioCtx();
                }
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(() => {});
            }
        }

        toggleMute() {
            this.muted = !this.muted;
            if (this.muted) {
                this.stopBgm();
            } else if (window.gameInstance && window.gameInstance.state === 'playing') {
                this.startBgm();
            }
            return this.muted;
        }

        playBell() {
            if (this.muted) return;
            this.init();
            if (!this.ctx) return;

            const now = this.ctx.currentTime;
            [1320, 1760].forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                const start = now + idx * 0.055;
                osc.frequency.setValueAtTime(freq, start);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.96, start + 0.24);

                gain.gain.setValueAtTime(0.001, start);
                gain.gain.linearRampToValueAtTime(0.22, start + 0.012);
                gain.gain.exponentialRampToValueAtTime(0.0008, start + 0.26);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(start);
                osc.stop(start + 0.28);
            });
        }

        playJump() {
            if (this.muted) return;
            this.init();
            if (!this.ctx) return;

            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(540, now + 0.16);

            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.19);
        }

        playPickup(isSpecial = false) {
            if (this.muted) return;
            this.init();
            if (!this.ctx) return;

            const now = this.ctx.currentTime;
            const notes = isSpecial ? [587.33, 783.99, 987.77, 1174.66] : [587.33, 880];
            notes.forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                const t = now + i * 0.055;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(0.14, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + 0.15);
            });
        }

        playLaneSwitch() {
            if (this.muted) return;
            this.init();
            if (!this.ctx) return;

            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(310, now);
            osc.frequency.exponentialRampToValueAtTime(430, now + 0.06);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.075);
        }

        playHit() {
            if (this.muted) return;
            this.init();
            if (!this.ctx) return;

            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(175, now);
            osc.frequency.exponentialRampToValueAtTime(48, now + 0.34);

            gain.gain.setValueAtTime(0.24, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.37);
        }

        playHoleFall() {
            if (this.muted) return;
            this.init();
            if (!this.ctx) return;

            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(75, now + 0.55);

            gain.gain.setValueAtTime(0.24, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.58);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.6);
        }

        startBgm() {
            if (this.muted || this.bgmTimer) return;
            this.init();
            const scale = [293.66, 329.63, 392.00, 440.00, 587.33, 440.00, 392.00, 329.63];
            this.bgmTimer = setInterval(() => {
                if (this.muted || !this.ctx || this.ctx.state !== 'running') return;
                if (!window.gameInstance || window.gameInstance.state !== 'playing') return;

                const now = this.ctx.currentTime;
                const freq = scale[this.noteStep % scale.length];
                this.noteStep++;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.032, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.19);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }, 240);
        }

        stopBgm() {
            if (this.bgmTimer) {
                clearInterval(this.bgmTimer);
                this.bgmTimer = null;
            }
        }

        speakWelcome() {
            if (this.muted || !('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const voices = window.speechSynthesis.getVoices() || [];
                const femaleKeywords = [
                    'linh', 'mai', 'huong', 'hương', 'lan', 'thao', 'thảo', 'an',
                    'google tiếng việt', 'female', 'femme', 'woman'
                ];

                const viUtterance = new SpeechSynthesisUtterance('Xin chào mọi người !');
                viUtterance.lang = 'vi-VN';
                viUtterance.rate = 1.15;
                viUtterance.pitch = 1.28;

                const viVoices = voices.filter((v) =>
                    (v.lang || '').toLowerCase().startsWith('vi')
                );
                const viFemale =
                    viVoices.find((v) =>
                        femaleKeywords.some((kw) => (v.name || '').toLowerCase().includes(kw))
                    ) ||
                    viVoices[0] ||
                    null;

                if (viFemale) {
                    viUtterance.voice = viFemale;
                }

                window.speechSynthesis.speak(viUtterance);
            } catch (_) {
                // Ignore speech synthesis restrictions
            }
        }
    }

    // --- 2. GESTIONNAIRE DU SPRITE DE LUDO (8 FRAMES + DÉTOURAGE FLOODFILL) ---
    class LudoSpriteManager {
        constructor() {
            this.spriteCanvas = null;
            this.frames = [];
            this.frameIndex = 0;
            this.framesDirectory = 'assets/frames';
            this.frameFileNames = [
                'fram1.jpg',
                'fram2.jpg',
                'fram3.jpg',
                'fram4.jpg',
                'fram5.jpg',
                'fram6.jpg',
                'fram7.jpg',
                'fram8.jpg'
            ];

            this.buildFallbackLudoSprite();
            this.loadFramesFromCandidateDirs(this.getAutoFrameDirs(), 0, this.frameFileNames);
        }

        getGithubBaseUrl() {
            try {
                const host = window.location.hostname || '';
                const pathname = window.location.pathname || '';
                if (host.endsWith('.github.io')) {
                    const owner = host.replace('.github.io', '');
                    const parts = pathname.split('/').filter(Boolean);
                    const repo = parts.length > 0 ? parts[0] : 'Ludovelo';
                    return `https://raw.githubusercontent.com/${owner}/${repo}/main`;
                }
                if (host === 'raw.githubusercontent.com') {
                    const parts = pathname.split('/').filter(Boolean);
                    if (parts.length >= 3) {
                        return `https://raw.githubusercontent.com/${parts[0]}/${parts[1]}/${parts[2]}`;
                    }
                }
            } catch (_) {
                // Ignore URL parsing issues
            }
            return null;
        }

        getAutoFrameDirs() {
            const dirs = [
                'assets/frames',
                './assets/frames',
                'C:/Users/fredb/Desktop/Ludovelo/assets/frames',
                'file:///C:/Users/fredb/Desktop/Ludovelo/assets/frames',
                '.',
                'assets'
            ];
            const ghBase = this.getGithubBaseUrl();
            if (ghBase) {
                dirs.splice(2, 0, `${ghBase}/assets/frames`);
            }
            return [...new Set(dirs)];
        }

        loadFramesFromCandidateDirs(dirs, dirIdx, fileNames) {
            if (dirIdx >= dirs.length) {
                this.loadSpriteSheet([
                    'Sprite de cycliste pixel-art et animation.png',
                    'Cycliste pixel art en série d’animation.png',
                    'ludovelo.jpg',
                    'assets/Sprite de cycliste pixel-art et animation.png',
                    'assets/ludovelo.jpg'
                ]);
                return;
            }

            const rawDir = dirs[dirIdx];
            const cleanDir = rawDir.replace(/\/+$/, '');
            const loadedFrames = new Array(fileNames.length);
            let completed = 0;

            const buildUrl = (fileName) => {
                if (/^[A-Za-z]:\//.test(cleanDir)) {
                    return `file:///${cleanDir}/${fileName}`;
                }
                return cleanDir === '.' ? fileName : `${cleanDir}/${fileName}`;
            };

            fileNames.forEach((fileName, idx) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        loadedFrames[idx] = this.cutoutBackgroundFloodfill(img);
                    } catch (err) {
                        console.warn(`Détourage impossible pour ${fileName} :`, err);
                    }
                    completed++;
                    if (completed === fileNames.length) {
                        const validFrames = loadedFrames.filter(Boolean);
                        if (validFrames.length > 0) {
                            this.frames = validFrames;
                            this.spriteCanvas = validFrames[0];
                            this.framesDirectory = cleanDir;
                        } else {
                            this.loadFramesFromCandidateDirs(dirs, dirIdx + 1, fileNames);
                        }
                    }
                };
                img.onerror = () => {
                    completed++;
                    if (completed === fileNames.length) {
                        const validFrames = loadedFrames.filter(Boolean);
                        if (validFrames.length > 0) {
                            this.frames = validFrames;
                            this.spriteCanvas = validFrames[0];
                        } else {
                            this.loadFramesFromCandidateDirs(dirs, dirIdx + 1, fileNames);
                        }
                    }
                };
                img.src = buildUrl(fileName);
            });
        }

        loadSpriteSheet(candidates, idx = 0) {
            if (idx >= candidates.length) return;
            const src = candidates[idx];
            const img = new Image();
            if (!src.startsWith('data:')) {
                img.crossOrigin = 'anonymous';
            }
            img.onload = () => {
                try {
                    const sheetCutout = this.cutoutBackgroundFloodfill(img);
                    const extracted = this.extractEightFramesFromSheet(sheetCutout);
                    if (extracted.length >= 4) {
                        this.frames = extracted;
                        this.spriteCanvas = extracted[0];
                    } else {
                        this.frames = [sheetCutout];
                        this.spriteCanvas = sheetCutout;
                    }
                } catch (err) {
                    console.warn('Détourage impossible, repli sur le sprite intégré :', err);
                    this.loadSpriteSheet(candidates, idx + 1);
                }
            };
            img.onerror = () => {
                this.loadSpriteSheet(candidates, idx + 1);
            };
            img.src = src;
        }

        extractEightFramesFromSheet(sheetCanvas) {
            const w = sheetCanvas.width;
            const h = sheetCanvas.height;
            const ctx = sheetCanvas.getContext('2d');
            const { data } = ctx.getImageData(0, 0, w, h);

            const minY = Math.floor(h * 0.56);
            const colHasOpaque = new Uint8Array(w);
            for (let x = 0; x < w; x++) {
                for (let y = minY; y < h; y++) {
                    if (data[(y * w + x) * 4 + 3] > 25) {
                        colHasOpaque[x] = 1;
                        break;
                    }
                }
            }

            const segments = [];
            let start = -1;
            for (let x = 0; x < w; x++) {
                if (colHasOpaque[x] && start === -1) {
                    start = x;
                } else if (!colHasOpaque[x] && start !== -1) {
                    if (x - start >= Math.floor(w * 0.04)) {
                        segments.push({ x0: start, x1: x - 1 });
                    }
                    start = -1;
                }
            }
            if (start !== -1 && w - start >= Math.floor(w * 0.04)) {
                segments.push({ x0: start, x1: w - 1 });
            }

            if (segments.length < 4) return [];

            const targetSegs = segments.slice(0, 8);
            const frames = [];

            for (const seg of targetSegs) {
                let top = h;
                let bottom = 0;
                for (let y = 0; y < h; y++) {
                    for (let x = seg.x0; x <= seg.x1; x++) {
                        if (data[(y * w + x) * 4 + 3] > 25) {
                            if (y < top) top = y;
                            if (y > bottom) bottom = y;
                        }
                    }
                }
                if (bottom <= top) continue;

                const pad = 4;
                const sx = Math.max(0, seg.x0 - pad);
                const sy = Math.max(0, top - pad);
                const sw = Math.min(w - sx, (seg.x1 - seg.x0 + 1) + pad * 2);
                const sh = Math.min(h - sy, (bottom - top + 1) + pad * 2);

                const frameCanvas = document.createElement('canvas');
                frameCanvas.width = sw;
                frameCanvas.height = sh;
                const fctx = frameCanvas.getContext('2d');
                fctx.drawImage(sheetCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
                frames.push(frameCanvas);
            }

            return frames;
        }

        cutoutBackgroundFloodfill(img) {
            const maxDim = 520;
            let w = img.naturalWidth || img.width;
            let h = img.naturalHeight || img.height;
            if (w > maxDim || h > maxDim) {
                const scale = Math.min(maxDim / w, maxDim / h);
                w = Math.max(1, Math.round(w * scale));
                h = Math.max(1, Math.round(h * scale));
            }

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            const cornerCoords = [
                [0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1],
                [Math.floor(w / 2), 0], [Math.floor(w / 2), h - 1],
                [0, Math.floor(h / 2)], [w - 1, Math.floor(h / 2)]
            ];

            let bgR = 255, bgG = 255, bgB = 255, samples = 0;
            for (const [sx, sy] of cornerCoords) {
                const idx = (sy * w + sx) * 4;
                const r = data[idx], g = data[idx + 1], b = data[idx + 2], a = data[idx + 3];
                if (a > 200) {
                    bgR += r; bgG += g; bgB += b;
                    samples++;
                }
            }
            if (samples > 0) {
                bgR = Math.round(bgR / samples);
                bgG = Math.round(bgG / samples);
                bgB = Math.round(bgB / samples);
            }

            const visited = new Uint8Array(w * h);
            const queue = new Int32Array(w * h);
            let head = 0, tail = 0;

            const tolerance = 34;
            const isBgLike = (pixelIdx) => {
                const i = pixelIdx * 4;
                if (data[i + 3] < 20) return true;
                const dr = Math.abs(data[i] - bgR);
                const dg = Math.abs(data[i + 1] - bgG);
                const db = Math.abs(data[i + 2] - bgB);
                const lum = (data[i] + data[i + 1] + data[i + 2]) / 3;
                return (dr <= tolerance && dg <= tolerance && db <= tolerance) || (lum > 244 && dr < 14 && dg < 14 && db < 14);
            };

            const tryEnqueue = (x, y) => {
                if (x < 0 || x >= w || y < 0 || y >= h) return;
                const pIdx = y * w + x;
                if (!visited[pIdx] && isBgLike(pIdx)) {
                    visited[pIdx] = 1;
                    queue[tail++] = pIdx;
                }
            };

            for (let x = 0; x < w; x++) {
                tryEnqueue(x, 0);
                tryEnqueue(x, h - 1);
            }
            for (let y = 0; y < h; y++) {
                tryEnqueue(0, y);
                tryEnqueue(w - 1, y);
            }

            while (head < tail) {
                const curr = queue[head++];
                const cx = curr % w;
                const cy = (curr - cx) / w;

                if (cx > 0) tryEnqueue(cx - 1, cy);
                if (cx < w - 1) tryEnqueue(cx + 1, cy);
                if (cy > 0) tryEnqueue(cx, cy - 1);
                if (cy < h - 1) tryEnqueue(cx, cy + 1);
            }

            for (let p = 0; p < w * h; p++) {
                if (visited[p]) {
                    data[p * 4 + 3] = 0;
                }
            }

            ctx.putImageData(imgData, 0, 0);
            return canvas;
        }

        getFrame(index = this.frameIndex) {
            if (this.frames && this.frames.length > 0) {
                const idx = ((Math.floor(index) % this.frames.length) + this.frames.length) % this.frames.length;
                return this.frames[idx];
            }
            return this.spriteCanvas;
        }
    }

            ctx.fillRect(0, 0, 160, 160);

                seed = (seed * 16807) % 2147483647;
                return (seed - 1) / 2147483646;
            };

            for (let i = 0; i < 2200; i++) {
                const x = Math.floor(rand() * 160);
                const y = Math.floor(rand() * 160);
                const v = rand() > 0.5 ? 78 + Math.floor(rand() * 24) : 34 + Math.floor(rand() * 18);
                ctx.fillStyle = `rgba(${v}, ${v + 2}, ${v + 5}, 0.45)`;

                ctx.beginPath();
                let cx = rand() * 160;

                ctx.moveTo(cx, cy);
                for (let s = 0; s < 4; s++) {
                    cx += (rand() - 0.5) * 28;

                e.preventDefault();
                e.stopPropagation();
                if (this.state === 'playing') {
                    this.ringBell();
                    const btn = document.getElementById('btn-bell');
                    btn.classList.remove('bell-pulse');
                    void btn.offsetWidth;
                    btn.classList.add('bell-pulse');
                }
            });

            document.getElementById('btn-start').addEventListener('click', () => this.startGame());
            document.getElementById('btn-pause').addEventListener('click', () => this.pauseGame());
            document.getElementById('btn-resume').addEventListener('click', () => this.resumeGame());
            document.getElementById('btn-quit-menu').addEventListener('click', () => this.showMenu());
            document.getElementById('btn-restart').addEventListener('click', () => this.startGame());
            document.getElementById('btn-home').addEventListener('click', () => this.showMenu());

            document.getElementById('btn-sound').addEventListener('click', () => {
                const muted = this.sound.toggleMute();
                document.getElementById('btn-sound').textContent = muted ? '🔇' : '🔊';
                if (muted && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
            });

            document.getElementById('btn-voice-welcome').addEventListener('click', (e) => {
                e.stopPropagation();
                this.sound.speakWelcome();
            });
        }

        showEventBanner(text, duration = 1700) {
            const el = document.getElementById('event-banner');
            el.firstElementChild.textContent = text;
            el.classList.remove('hidden');
            clearTimeout(this.bannerTimeout);
            this.bannerTimeout = setTimeout(() => {
                el.classList.add('hidden');
            }, duration);
        }

        startGame() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            this.sound.init();
            this.sound.startBgm();

            this.score = 0;
            this.distance = 0;
            this.lives = 3;
            this.basketCount = 0;
            this.combo = 1;
            this.comboTimer = 0;
            this.speed = this.baseSpeed;
            this.elapsed = 0;
            this.bgRevealProgress = 0.2;

            this.player.lane = 1;
            this.player.y = this.laneY[1];
            this.player.z = 0;
            this.player.vz = 0;
            this.player.pitch = 0;
            this.player.wheelAngle = 0;
            this.player.pedalPhase = 0;
            this.player.invulnTimer = 1.0;
            this.player.shieldTimer = 0;
            this.player.bellTimer = 0;
            this.player.fallingIntoHole = null;
            this.player.fallProgress = 0;

            this.holes = [];
            this.obstacles = [];
            this.collectibles = [];
            this.particles = [];
            this.floatingTexts = [];
            this.holeSpawnTimer = 2.6;
            this.obstacleSpawnTimer = 1.2;
            this.collectibleSpawnTimer = 1.5;

            this.state = 'playing';
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('touch-controls').classList.remove('hidden');

            this.updateHud();
            this.showEventBanner('🇻🇳 C’est parti ! Saute au-dessus des trous de la route !', 2200);
        }

        pauseGame() {
            if (this.state !== 'playing') return;
            this.state = 'paused';
            this.sound.stopBgm();
            document.getElementById('pause-screen').classList.remove('hidden');
        }

        resumeGame() {
            if (this.state !== 'paused') return;
            this.state = 'playing';
            this.sound.init();
            this.sound.startBgm();
            document.getElementById('pause-screen').classList.add('hidden');
            this.lastTimestamp = performance.now();
        }

        showMenu() {
            this.state = 'menu';
            this.sound.stopBgm();
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('touch-controls').classList.add('hidden');
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        changeLane(delta) {
            if (this.player.fallingIntoHole) return;
            const nextLane = Math.max(0, Math.min(this.laneCount - 1, this.player.lane + delta));
            if (nextLane !== this.player.lane) {
                this.player.lane = nextLane;
                this.sound.playLaneSwitch();
                this.spawnDust(this.player.x - 20, this.player.y + 16, 5);
            }
        }

        jump() {
            if (this.player.fallingIntoHole) return;
            if (this.player.z <= 1) {
                this.player.vz = 560;
                this.player.z = 2;
                this.sound.playJump();
                this.spawnDust(this.player.x - 10, this.player.y + 18, 8);
            }
        }

        ringBell() {
            if (this.player.fallingIntoHole) return;
            this.sound.playBell();
            this.player.bellTimer = 0.45;
            this.floatingTexts.push({
                x: this.player.x + 25,
                y: this.player.y - this.player.z - 75,
                text: '🔔 DRING DRING !',
                color: '#fde047',
                life: 0.85
            });

            let alertedCount = 0;
            for (const obs of this.obstacles) {
                const distX = obs.x - this.player.x;
                if (distX > -40 && distX < 420 && !obs.alerted) {
                    obs.alerted = true;
                    obs.scaredTimer = 1.2;
                    alertedCount++;

                    if (obs.kind === 'chicken' || obs.kind === 'dog' || obs.kind === 'cat') {
                        obs.vy = (obs.lane === 0 ? 1 : -1) * 95;
                        obs.vx += 75;
                    } else if (obs.kind === 'vendor' || obs.kind === 'scooter') {
                        obs.vx = Math.max(obs.vx * 0.45, 35);
                    }
                }
            }

            if (alertedCount > 0) {
                this.addScore(35 * alertedCount);
                this.showEventBanner(`🔔 Dring ! ${alertedCount} obstacle(s) réagissent (+${35 * alertedCount})`, 1400);
            }
        }

        addScore(pts) {
            this.score += Math.round(pts * this.combo);
            if (this.score > this.bestScore) {
                this.bestScore = this.score;
                localStorage.setItem('ludo_vn_side_best', String(this.bestScore));
            }
        }

        spawnHole() {
            const isWideTrench = Math.random() < 0.38;
            const width = isWideTrench ? 132 : 86;
            const lane = Math.floor(Math.random() * this.laneCount);

            this.holes.push({
                x: this.width + 90,
                width,
                lane,
                isWideTrench,
                warned: false
            });
        }

        spawnObstacle() {
            const lane = Math.floor(Math.random() * this.laneCount);
            const y = this.laneY[lane];
            const roll = Math.random();

            let kind = 'chicken';
            let width = 40;
            let height = 30;
            let extraSpeed = 35;

            if (roll < 0.28) {
                kind = 'chicken';
                width = 40;
                height = 30;
                extraSpeed = 35;
            } else if (roll < 0.55) {
                kind = 'scooter';
                width = 88;
                height = 56;
                extraSpeed = 125;
            } else if (roll < 0.80) {
                kind = 'vendor';
                width = 78;
                height = 54;
                extraSpeed = 25;
            } else {
                kind = 'dog';
                width = 52;
                height = 38;
                extraSpeed = 65;
            }

            const tooCloseToHole = this.holes.some(
                (h) => h.lane === lane && Math.abs(h.x - (this.width + 80)) < 170
            );
            if (tooCloseToHole) return;

            this.obstacles.push({
                x: this.width + 80,
                y,
                lane,
                width,
                height,
                kind,
                vx: extraSpeed,
                vy: 0,
                animPhase: Math.random() * Math.PI * 2,
                alerted: false,
                scaredTimer: 0,
                passed: false
            });
        }

        spawnCollectible() {
            const lane = Math.floor(Math.random() * this.laneCount);
            const y = this.laneY[lane];
            const roll = Math.random();

            let kind = 'banh_mi';
            let label = 'Bánh mì';
            let points = 100;

            if (roll < 0.36) {
                kind = 'banh_mi';
                label = '🥖 Bánh mì +100';
                points = 100;
            } else if (roll < 0.68) {
                kind = 'pho';
                label = '🍜 Phở +150';
                points = 150;
            } else if (roll < 0.88) {
                kind = 'coffee';
                label = '☕ Cà phê sữa đá +120';
                points = 120;
            } else {
                kind = 'non_la';
                label = '👒 Bouclier Nón lá !';
                points = 150;
            }

            this.collectibles.push({
                x: this.width + 70,
                y,
                lane,
                z: Math.random() < 0.35 ? 42 : 0,
                kind,
                label,
                points,
                bobPhase: Math.random() * Math.PI * 2
            });
        }

        spawnDust(x, y, count = 6, color = 'rgba(226, 232, 240, 0.75)') {
            for (let i = 0; i < count; i++) {
                this.particles.push({
                    x: x + (Math.random() - 0.5) * 18,
                    y: y + (Math.random() - 0.5) * 10,
                    vx: -60 - Math.random() * 90,
                    vy: -25 - Math.random() * 65,
                    radius: 3 + Math.random() * 4.5,
                    color,
                    life: 0.35 + Math.random() * 0.25,
                    maxLife: 0.6
                });
            }
        }

        update(dt) {
            this.elapsed += dt;

            if (this.state === 'menu') {
                this.bgScrollX = (this.bgScrollX + 45 * dt) % 2000;
                this.scrollX = (this.scrollX + 110 * dt) % 160;
                return;
            }

            if (this.state !== 'playing') return;

            if (this.player.fallingIntoHole) {
                this.player.fallProgress += dt * 1.9;
                this.player.pitch = Math.min(1.15, this.player.fallProgress * 1.35);
                this.player.z = -this.player.fallProgress * 58;
                this.updateParticles(dt);
                this.updateFloatingTexts(dt);

                if (this.player.fallProgress >= 1) {
                    this.triggerGameOver(
                        '🕳️',
                        'Chute dans le trou !',
                        'Ludo a plongé dans un trou de la route vietnamienne ! Pense à sauter plus tôt.'
                    );
                }
                return;
            }

            this.speed = Math.min(640, this.baseSpeed + this.distance * 0.14 + this.basketCount * 4);
            const worldStep = this.speed * dt;
            this.distance += worldStep * 0.045;
            this.addScore(worldStep * 0.08);

            if (this.bgRevealProgress < 1) {
                this.bgRevealProgress = Math.min(1, this.bgRevealProgress + dt * 0.35);
            }

            this.scrollX = (this.scrollX + worldStep) % 160;
            this.bgScrollX += worldStep * 0.42;

            if (this.comboTimer > 0) {
                this.comboTimer -= dt;
                if (this.comboTimer <= 0) {
                    this.combo = 1;
                }
            }

            if (this.player.invulnTimer > 0) this.player.invulnTimer = Math.max(0, this.player.invulnTimer - dt);
            if (this.player.shieldTimer > 0) this.player.shieldTimer = Math.max(0, this.player.shieldTimer - dt);
            if (this.player.bellTimer > 0) this.player.bellTimer = Math.max(0, this.player.bellTimer - dt);

            const targetY = this.laneY[this.player.lane] ?? this.laneY[1];
            this.player.y += (targetY - this.player.y) * Math.min(1, dt * 15);

            if (this.player.z > 0 || this.player.vz !== 0) {
                this.player.z += this.player.vz * dt;
                this.player.vz -= 1480 * dt;
                this.player.pitch = Math.max(-0.32, Math.min(0.28, -this.player.vz * 0.00045));

                if (this.player.z <= 0) {
                    this.player.z = 0;
                    this.player.vz = 0;
                    this.player.pitch = 0;
                    this.spawnDust(this.player.x, this.player.y + 18, 7);
                }
            } else {
                this.player.pitch = Math.sin(this.elapsed * 14) * 0.025;
            }

            this.player.wheelAngle += (worldStep / 24);
            const pedalSpeedMultiplier = this.player.z > 4 ? 0.35 : (this.speed / this.baseSpeed);
            this.player.pedalPhase += dt * 11.5 * pedalSpeedMultiplier;
            this.ludoSprite.frameIndex = Math.floor(this.player.pedalPhase) % Math.max(1, this.ludoSprite.frames.length);

            this.scenerySpawnTimer -= dt;
            if (this.scenerySpawnTimer <= 0) {
                this.scenerySpawnTimer = 0.85 + Math.random() * 0.65;
                const types = ['house', 'banana', 'lantern_post', 'stall', 'coconut'];
                this.sceneryProps.push({
                    x: this.width + 120,
                    type: types[Math.floor(Math.random() * types.length)],
                    variant: Math.floor(Math.random() * 3)
                });
            }
            for (let i = this.sceneryProps.length - 1; i >= 0; i--) {
                this.sceneryProps[i].x -= this.speed * 0.52 * dt;
                if (this.sceneryProps[i].x < -220) {
                    this.sceneryProps.splice(i, 1);
                }
            }

            this.holeSpawnTimer -= dt;
            if (this.holeSpawnTimer <= 0) {
                this.spawnHole();
                this.holeSpawnTimer = Math.max(1.55, 3.2 - this.speed * 0.0022) + Math.random() * 0.9;
            }

            for (let i = this.holes.length - 1; i >= 0; i--) {
                const h = this.holes[i];
                h.x -= worldStep;

                if (!h.warned && h.x < this.width - 80 && h.x > 0) {
                    h.warned = true;
                }

                if (h.lane === this.player.lane && this.player.z < 14) {
                    const holeLeft = h.x - h.width * 0.36;
                    const holeRight = h.x + h.width * 0.36;
                    if (this.player.x > holeLeft && this.player.x < holeRight) {
                        this.startFallIntoHole(h);
                        return;
                    }
                }

                if (h.x + h.width < -140) {
                    this.holes.splice(i, 1);
                }
            }

            this.obstacleSpawnTimer -= dt;
            if (this.obstacleSpawnTimer <= 0) {
                this.spawnObstacle();
                this.obstacleSpawnTimer = Math.max(0.82, 1.85 - this.speed * 0.0014) + Math.random() * 0.55;
            }

            for (let i = this.obstacles.length - 1; i >= 0; i--) {
                const obs = this.obstacles[i];
                obs.x -= (this.speed + obs.vx) * dt;
                obs.y += obs.vy * dt;
                obs.y = Math.max(this.roadTop + 10, Math.min(this.roadBottom - 10, obs.y));
                obs.animPhase += dt * 10;
                if (obs.scaredTimer > 0) obs.scaredTimer -= dt;

                if (!obs.passed && obs.x + obs.width * 0.5 < this.player.x) {
                    obs.passed = true;
                    this.addScore(25);
                }

                const sameLane = Math.abs(obs.y - this.player.y) < 24;
                const overlapX = Math.abs(obs.x - this.player.x) < (obs.width * 0.42 + 34);
                const clearJump = this.player.z > 36;

                if (sameLane && overlapX && !clearJump && this.player.invulnTimer <= 0) {
                    this.handleObstacleHit(obs);
                    this.obstacles.splice(i, 1);
                    if (this.state !== 'playing') return;
                    continue;
                }

                if (obs.x < -160) {
                    this.obstacles.splice(i, 1);
                }
            }

            this.collectibleSpawnTimer -= dt;
            if (this.collectibleSpawnTimer <= 0) {
                this.spawnCollectible();
                this.collectibleSpawnTimer = 1.4 + Math.random() * 1.2;
            }

            for (let i = this.collectibles.length - 1; i >= 0; i--) {
                const col = this.collectibles[i];
                col.x -= worldStep;
                col.bobPhase += dt * 5;

                const sameLane = Math.abs(col.y - this.player.y) < 28;
                const distX = Math.abs(col.x - this.player.x) < 46;
                const heightMatch = Math.abs(col.z - this.player.z) < 48;

                if (sameLane && distX && heightMatch) {
                    this.collectItem(col);
                    this.collectibles.splice(i, 1);
                    continue;
                }

                if (col.x < -120) {
                    this.collectibles.splice(i, 1);
                }
            }

            this.updateParticles(dt);
            this.updateFloatingTexts(dt);
            this.updateHud();
        }

        startFallIntoHole(hole) {
            this.player.fallingIntoHole = hole;
            this.player.fallProgress = 0;
            this.player.x = hole.x;
            this.player.y = this.laneY[hole.lane];
            this.sound.stopBgm();
            this.sound.playHoleFall();
            this.spawnDust(hole.x, this.laneY[hole.lane], 14, 'rgba(120, 95, 65, 0.85)');
            this.floatingTexts.push({
                x: hole.x,
                y: this.laneY[hole.lane] - 50,
                text: '🕳️ PLOUF DANS LE TROU !',
                color: '#fda4af',
                life: 1.1
            });
        }

        handleObstacleHit(obs) {
            if (this.player.shieldTimer > 0) {
                this.player.shieldTimer = 0;
                this.player.invulnTimer = 1.1;
                this.sound.playPickup(true);
                this.spawnDust(obs.x, obs.y, 12, 'rgba(253, 224, 71, 0.9)');
                this.floatingTexts.push({
                    x: obs.x,
                    y: obs.y - 40,
                    text: '👒 Nón lá a paré le choc !',
                    color: '#fde047',
                    life: 1.0
                });
                this.showEventBanner('👒 Ton chapeau Nón lá a protégé Ludo !', 1500);
                return;
            }

            this.lives -= 1;
            this.combo = 1;
            this.comboTimer = 0;
            this.player.invulnTimer = 1.45;
            this.speed = Math.max(this.baseSpeed * 0.78, this.speed * 0.82);
            this.sound.playHit();
            this.spawnDust(this.player.x, this.player.y, 12, 'rgba(248, 113, 113, 0.85)');

            this.floatingTexts.push({
                x: this.player.x,
                y: this.player.y - this.player.z - 55,
                text: '💥 Aïe !',
                color: '#f87171',
                life: 0.9
            });

            this.updateHud();

            if (this.lives <= 0) {
                this.triggerGameOver(
                    '💥',
                    'Fin de la balade !',
                    'Ludo a heurté trop d’obstacles sur la route du village.'
                );
            }
        }

        collectItem(col) {
            this.basketCount += 1;
            this.combo = Math.min(5, this.combo + 0.5);
            this.comboTimer = 4.0;
            this.addScore(col.points);
            this.sound.playPickup(col.kind === 'non_la' || col.kind === 'pho');

            if (col.kind === 'non_la') {
                this.player.shieldTimer = 12;
                this.showEventBanner('👒 Bouclier Nón lá activé !', 1600);
            } else if (col.kind === 'coffee') {
                this.speed = Math.min(680, this.speed + 45);
                this.showEventBanner('☕ Cà phê sữa đá : coup de boost !', 1500);
            }

            this.spawnDust(col.x, col.y - col.z, 8, 'rgba(74, 222, 128, 0.85)');
            this.floatingTexts.push({
                x: col.x,
                y: col.y - col.z - 28,
                text: col.label,
                color: '#86efac',
                life: 0.95
            });
            this.updateHud();
        }

        triggerGameOver(icon, title, reason) {
            this.state = 'gameover';
            this.sound.stopBgm();

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('touch-controls').classList.add('hidden');
            const goImg = document.getElementById('gameover-bg-img');
            if (goImg && this.gameOverImageSrc) {
                goImg.src = this.gameOverImageSrc;
                goImg.classList.remove('hidden');
                document.getElementById('gameover-icon').classList.add('hidden');
            } else {
                document.getElementById('gameover-icon').classList.remove('hidden');
                document.getElementById('gameover-icon').textContent = icon;
            }
            document.getElementById('gameover-title').textContent = title;
            document.getElementById('gameover-reason').textContent = reason;
            document.getElementById('final-score').textContent = Math.floor(this.score).toLocaleString('fr-FR');
            document.getElementById('final-best').textContent = Math.floor(this.bestScore).toLocaleString('fr-FR');
            document.getElementById('final-distance').textContent = `${Math.floor(this.distance)} m`;
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        updateParticles(dt) {
            for (let i = this.particles.length - 1; i >= 0; i--) {
                const p = this.particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 180 * dt;
                p.life -= dt;
                if (p.life <= 0) {
                    this.particles.splice(i, 1);
                }
            }
        }

        updateFloatingTexts(dt) {
            for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
                const ft = this.floatingTexts[i];
                ft.y -= 36 * dt;
                ft.life -= dt;
                if (ft.life <= 0) {
                    this.floatingTexts.splice(i, 1);
                }
            }
        }

        updateHud() {
            document.getElementById('hud-score').textContent = Math.floor(this.score).toLocaleString('fr-FR');
            document.getElementById('hud-distance').textContent = `${Math.floor(this.distance)} m`;
            document.getElementById('hud-basket').textContent = String(this.basketCount);

            const comboBadge = document.getElementById('hud-combo-badge');
            if (this.combo > 1) {
                comboBadge.classList.remove('hidden');
                comboBadge.classList.add('flex');
                document.getElementById('hud-combo').textContent = `x${this.combo.toFixed(1).replace('.0', '')}`;
            } else {
                comboBadge.classList.add('hidden');
                comboBadge.classList.remove('flex');
            }

            const shieldEl = document.getElementById('hud-shield');
            if (this.player.shieldTimer > 0) {
                shieldEl.classList.remove('hidden');
            } else {
                shieldEl.classList.add('hidden');
            }

            const livesContainer = document.getElementById('hud-lives');
            livesContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const span = document.createElement('span');
                span.textContent = i < this.lives ? '❤️' : '🖤';
                livesContainer.appendChild(span);
            }
        }

        draw() {
            const ctx = this.ctx;
            const w = this.width;
            const h = this.height;

            ctx.clearRect(0, 0, w, h);

            this.drawVietnameseVillageBackdrop(ctx, w, h);
            if (!this.bgLoaded) {
                this.drawRoadAndHoles(ctx, w, h);
                this.drawForegroundGrass(ctx, w, h);
            } else {
                this.drawSubtleDirtLaneGuides(ctx, w);
            }

            const renderables = [];

            for (const hole of this.holes) {
                renderables.push({ sortY: this.laneY[hole.lane] - 2, draw: () => this.drawHole(ctx, hole) });
            }

            for (const col of this.collectibles) {
                renderables.push({ sortY: col.y, draw: () => this.drawCollectible(ctx, col) });
            }

            for (const obs of this.obstacles) {
                renderables.push({ sortY: obs.y, draw: () => this.drawObstacle(ctx, obs) });
            }

            renderables.push({
                sortY: this.player.y + 1,
                draw: () => this.drawPlayerLudo(ctx)
            });

            renderables.sort((a, b) => a.sortY - b.sortY);
            for (const item of renderables) {
                item.draw();
            }

            for (const p of this.particles) {
                const alpha = Math.max(0, p.life / p.maxLife);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            for (const ft of this.floatingTexts) {
                const alpha = Math.min(1, ft.life * 1.4);
                ctx.globalAlpha = Math.max(0, alpha);
                ctx.font = '800 16px Fredoka, Nunito, sans-serif';
                ctx.textAlign = 'center';
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
            }
            ctx.globalAlpha = 1;
        }

        drawVietnameseVillageBackdrop(ctx, w, h) {
            const horizonY = this.roadTop - 6;

            if (this.bgLoaded && this.bgImage) {
                const imgW = this.bgImage.naturalWidth || this.bgImage.width;
                const imgH = this.bgImage.naturalHeight || this.bgImage.height;
                const scale = h / imgH;
                const tileW = Math.max(320, Math.round(imgW * scale));
                const revealRatio = this.state === 'playing' ? this.bgRevealProgress : 1;
                const visibleWidth = Math.max(w * 0.2, w * revealRatio);
                const offset = ((this.bgScrollX % tileW) + tileW) % tileW;

                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, visibleWidth, h);
                ctx.clip();

                for (let x = -offset - tileW; x < visibleWidth + tileW; x += tileW) {
                    ctx.drawImage(this.bgImage, x, 0, tileW + 1, h);
                }
                ctx.restore();
                return;
            }

            const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
            skyGrad.addColorStop(0, '#5ba4e5');
            skyGrad.addColorStop(0.62, '#b8ddf2');
            skyGrad.addColorStop(1, '#e8e2c8');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, w, horizonY);

            const sunX = w * 0.82;
            const sunY = horizonY * 0.22;
            const sunGlow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 110);
            sunGlow.addColorStop(0, 'rgba(255, 248, 220, 0.95)');
            sunGlow.addColorStop(0.35, 'rgba(254, 224, 138, 0.35)');
            sunGlow.addColorStop(1, 'rgba(254, 224, 138, 0)');
            ctx.fillStyle = sunGlow;
            ctx.beginPath();
            ctx.arc(sunX, sunY, 110, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fffbeb';
            ctx.beginPath();
            ctx.arc(sunX, sunY, 24, 0, Math.PI * 2);
            ctx.fill();

            const drawKarstLayer = (parallax, baseColor, peakColor, heightScale, alpha) => {
                ctx.save();
                ctx.globalAlpha = alpha;
                const span = 340;
                const shift = ((this.bgScrollX * parallax) % span + span) % span;
                const grad = ctx.createLinearGradient(0, horizonY - heightScale, 0, horizonY);
                grad.addColorStop(0, peakColor);
                grad.addColorStop(1, baseColor);
                ctx.fillStyle = grad;

                ctx.beginPath();
                ctx.moveTo(-span, horizonY);
                for (let x = -span * 2 - shift; x < w + span * 2; x += span) {
                    const h1 = heightScale * (0.68 + 0.25 * Math.sin(x * 0.013));
                    const h2 = heightScale * (0.88 + 0.12 * Math.cos(x * 0.021));
                    ctx.lineTo(x + span * 0.18, horizonY - h1 * 0.45);
                    ctx.bezierCurveTo(
                        x + span * 0.28, horizonY - h1,
                        x + span * 0.48, horizonY - h1,
                        x + span * 0.56, horizonY - h1 * 0.35
                    );
                    ctx.lineTo(x + span * 0.66, horizonY - h2 * 0.5);
                    ctx.bezierCurveTo(
                        x + span * 0.76, horizonY - h2,
                        x + span * 0.92, horizonY - h2 * 0.95,
                        x + span, horizonY - h2 * 0.2
                    );
                }
                ctx.lineTo(w + span, horizonY);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            };

            drawKarstLayer(0.14, '#7ea89b', '#5d8a82', horizonY * 0.44, 0.65);
            drawKarstLayer(0.28, '#4f7c58', '#396144', horizonY * 0.34, 0.85);

            const paddyTop = horizonY - Math.max(48, horizonY * 0.18);
            const paddyGrad = ctx.createLinearGradient(0, paddyTop, 0, horizonY);
            paddyGrad.addColorStop(0, '#6b9b47');
            paddyGrad.addColorStop(1, '#4e7a34');
            ctx.fillStyle = paddyGrad;
            ctx.fillRect(0, paddyTop, w, horizonY - paddyTop + 4);

            ctx.strokeStyle = 'rgba(220, 245, 200, 0.22)';
            ctx.lineWidth = 1.2;
            const bundShift = ((this.bgScrollX * 0.45) % 180 + 180) % 180;
            for (let bx = -180 - bundShift; bx < w + 180; bx += 180) {
                ctx.beginPath();
                ctx.moveTo(bx, paddyTop + 4);
                ctx.lineTo(bx - 35, horizonY);
                ctx.stroke();
            }

            for (const prop of this.sceneryProps) {
                this.drawSceneryProp(ctx, prop, horizonY);
            }
        }

        drawSceneryProp(ctx, prop, horizonY) {
            const x = prop.x;
            const y = horizonY;

            if (prop.type === 'house') {
                const hw = 86;
                const hh = 46;
                ctx.fillStyle = 'rgba(15, 23, 42, 0.18)';
                ctx.beginPath();
                ctx.ellipse(x + hw * 0.5, y + 2, hw * 0.55, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = prop.variant === 0 ? '#d8b467' : (prop.variant === 1 ? '#cbb892' : '#bfa67a');
                ctx.fillRect(x, y - hh, hw, hh);

                ctx.fillStyle = '#5c4632';
                ctx.fillRect(x + 12, y - 24, 14, 24);
                ctx.fillStyle = '#475569';
                ctx.fillRect(x + 36, y - 32, 16, 13);
                ctx.fillRect(x + 58, y - 32, 16, 13);

                ctx.fillStyle = '#9e472a';
                ctx.beginPath();
                ctx.moveTo(x - 7, y - hh);
                ctx.lineTo(x + 12, y - hh - 18);
                ctx.lineTo(x + hw - 12, y - hh - 18);
                ctx.lineTo(x + hw + 7, y - hh);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = 'rgba(65, 25, 12, 0.35)';
                ctx.lineWidth = 1;
                for (let rx = x - 2; rx < x + hw + 4; rx += 7) {
                    ctx.beginPath();
                    ctx.moveTo(rx, y - hh);
                    ctx.lineTo(rx + 6, y - hh - 17);
                    ctx.stroke();
                }
            } else if (prop.type === 'banana' || prop.type === 'coconut') {
                ctx.strokeStyle = prop.type === 'coconut' ? '#6b533c' : '#567834';
                ctx.lineWidth = prop.type === 'coconut' ? 5 : 6;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.quadraticCurveTo(x - 6, y - 34, x + 3, y - 62);
                ctx.stroke();

                const crownX = x + 3;
                const crownY = y - 62;
                ctx.fillStyle = '#4c7c32';
                for (let a = -2.5; a <= 0.6; a += 0.52) {
                    ctx.beginPath();
                    ctx.ellipse(
                        crownX + Math.cos(a) * 18,
                        crownY + Math.sin(a) * 11,
                        19,
                        5.5,
                        a,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }

                if (prop.type === 'banana') {
                    ctx.fillStyle = '#eab308';
                    ctx.beginPath();
                    ctx.arc(crownX + 4, crownY + 8, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (prop.type === 'lantern_post') {
                ctx.strokeStyle = '#3b424c';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x, y - 66);
                ctx.lineTo(x + 16, y - 62);
                ctx.stroke();

                ctx.fillStyle = '#c93b2b';
                ctx.beginPath();
                ctx.ellipse(x + 16, y - 54, 6.5, 8.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f6c445';
                ctx.beginPath();
                ctx.arc(x + 16, y - 54, 2.5, 0, Math.PI * 2);
                ctx.fill();
            } else if (prop.type === 'stall') {
                ctx.fillStyle = '#7c5836';
                ctx.fillRect(x, y - 24, 54, 24);
                ctx.fillStyle = '#8d6e3f';
                ctx.beginPath();
                ctx.moveTo(x - 5, y - 24);
                ctx.lineTo(x + 27, y - 38);
                ctx.lineTo(x + 59, y - 24);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(x + 8, y - 18, 12, 9);
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(x + 25, y - 18, 14, 9);
            }
        }

        drawRoadAndHoles(ctx, w, h) {
            const top = this.roadTop;
            const bot = this.roadBottom;
            const roadH = bot - top;

            ctx.fillStyle = '#5c7a38';
            ctx.fillRect(0, top - 8, w, 10);

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, top, w, roadH);
            ctx.clip();

            if (this.roadPatternCanvas) {
                const pat = ctx.createPattern(this.roadPatternCanvas, 'repeat');
                if (pat) {
                    ctx.save();
                    ctx.translate(-this.scrollX, top);
                    ctx.fillStyle = pat;
                    ctx.fillRect(0, 0, w + this.scrollX + 160, roadH);
                    ctx.restore();
                }
            } else {
                ctx.fillStyle = '#3b4149';
                ctx.fillRect(0, top, w, roadH);
            }

            const lightingGrad = ctx.createLinearGradient(0, top, 0, bot);
            lightingGrad.addColorStop(0, 'rgba(15, 23, 42, 0.28)');
            lightingGrad.addColorStop(0.5, 'rgba(255, 250, 235, 0.04)');
            lightingGrad.addColorStop(1, 'rgba(15, 23, 42, 0.34)');
            ctx.fillStyle = lightingGrad;
            ctx.fillRect(0, top, w, roadH);

            ctx.strokeStyle = 'rgba(226, 232, 240, 0.45)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, top + 2);
            ctx.lineTo(w, top + 2);
            ctx.moveTo(0, bot - 2);
            ctx.lineTo(w, bot - 2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(248, 250, 252, 0.34)';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([34, 34]);
            ctx.lineDashOffset = this.scrollX;

            for (let l = 0; l < this.laneCount - 1; l++) {
                const ly = (this.laneY[l] + this.laneY[l + 1]) * 0.5;
                ctx.beginPath();
                ctx.moveTo(0, ly);
                ctx.lineTo(w, ly);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            ctx.restore();
        }

        drawForegroundGrass(ctx, w, h) {
            const bot = this.roadBottom;
            const fgH = h - bot;
            if (fgH <= 0) return;

            const curbGrad = ctx.createLinearGradient(0, bot, 0, bot + 12);
            curbGrad.addColorStop(0, '#9aa3ad');
            curbGrad.addColorStop(1, '#5d6670');
            ctx.fillStyle = curbGrad;
            ctx.fillRect(0, bot, w, 12);

            const grassGrad = ctx.createLinearGradient(0, bot + 10, 0, h);
            grassGrad.addColorStop(0, '#4f772d');
            grassGrad.addColorStop(1, '#2d4719');
            ctx.fillStyle = grassGrad;
            ctx.fillRect(0, bot + 10, w, fgH);

            const step = 28;
            const shift = ((this.scrollX * 1.15) % step + step) % step;
            ctx.strokeStyle = 'rgba(132, 184, 72, 0.38)';
            ctx.lineWidth = 2;
            for (let x = -step - shift; x < w + step; x += step) {
                ctx.beginPath();
                ctx.moveTo(x, bot + 12);
                ctx.lineTo(x - 6, bot + 2);
                ctx.moveTo(x + 7, bot + 12);
                ctx.lineTo(x + 12, bot + 3);
                ctx.stroke();
            }
        }

        drawSubtleDirtLaneGuides(ctx, w) {
            ctx.save();
            for (let l = 0; l < this.laneCount; l++) {
                const ly = this.laneY[l];
                const isCurrent = l === this.player.lane;

                if (isCurrent) {
                    const activeGrad = ctx.createLinearGradient(0, ly - 10, 0, ly + 10);
                    activeGrad.addColorStop(0, 'rgba(254, 240, 138, 0)');
                    activeGrad.addColorStop(0.5, 'rgba(254, 240, 138, 0.22)');
                    activeGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
                    ctx.fillStyle = activeGrad;
                    ctx.fillRect(0, ly - 10, w, 20);
                }

                if (l < this.laneCount - 1) {
                    const sepY = (this.laneY[l] + this.laneY[l + 1]) * 0.5;
                    ctx.strokeStyle = 'rgba(255, 251, 235, 0.22)';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([16, 22]);
                    ctx.lineDashOffset = this.scrollX;
                    ctx.beginPath();
                    ctx.moveTo(0, sepY);
                    ctx.lineTo(w, sepY);
                    ctx.stroke();
                }
            }
            ctx.setLineDash([]);
            ctx.restore();
        }

        drawHole(ctx, hole) {
            const y = this.laneY[hole.lane];
            const rx = hole.width * 0.5;
            const ry = hole.isWideTrench ? 22 : 16;

            ctx.save();

            ctx.strokeStyle = 'rgba(250, 204, 21, 0.65)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 5]);
            ctx.beginPath();
            ctx.ellipse(hole.x, y, rx + 6, ry + 5, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#57534e';
            ctx.beginPath();
            ctx.ellipse(hole.x, y + 1, rx + 3, ry + 2, 0, 0, Math.PI * 2);
            ctx.fill();

            const abyssGrad = ctx.createRadialGradient(hole.x, y + 3, 4, hole.x, y + 2, rx);
            abyssGrad.addColorStop(0, '#030712');
            abyssGrad.addColorStop(0.7, '#090d16');
            abyssGrad.addColorStop(1, '#27272a');
            ctx.fillStyle = abyssGrad;
            ctx.beginPath();
            ctx.ellipse(hole.x, y + 2, rx, ry, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(24, 24, 27, 0.9)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(hole.x, y + 2, rx - 1, ry - 1, 0, Math.PI * 0.1, Math.PI * 1.15);
            ctx.stroke();

            if (hole.x - rx > this.player.x && hole.x - rx < this.player.x + 260) {
                ctx.fillStyle = '#e11d48';
                ctx.beginPath();
                ctx.roundRect(hole.x - rx - 10, y - ry - 26, 20, 18, 4);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = '900 12px Nunito, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('!', hole.x - rx, y - ry - 13);
            }

            ctx.restore();
        }

        drawPlayerLudo(ctx) {
            const p = this.player;
            const activeFrame = this.ludoSprite.getFrame(this.ludoSprite.frameIndex);

            if (p.invulnTimer > 0 && Math.floor(p.invulnTimer * 16) % 2 === 0 && !p.fallingIntoHole) {
                ctx.globalAlpha = 0.45;
            }

            const shadowScale = p.fallingIntoHole
                ? Math.max(0.15, 1 - p.fallProgress)
                : Math.max(0.35, 1 - p.z / 170);
            ctx.fillStyle = 'rgba(15, 23, 42, 0.36)';
            ctx.beginPath();
            ctx.ellipse(p.x, p.y + 16, 44 * shadowScale, 11 * shadowScale, 0, 0, Math.PI * 2);
            ctx.fill();

            if (p.bellTimer > 0) {
                const waveR = 26 + (0.45 - p.bellTimer) * 160;
                ctx.strokeStyle = `rgba(250, 204, 21, ${p.bellTimer * 1.8})`;
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.arc(p.x + 28, p.y - p.z - 42, waveR, -0.9, 0.9);
                ctx.stroke();
            }

            ctx.save();
            const drawY = p.y - p.z;
            ctx.translate(p.x, drawY + 14);

            if (p.fallingIntoHole) {
                const clipTop = -120 + p.fallProgress * 138;
                ctx.beginPath();
                ctx.rect(-110, clipTop, 220, 160);
                ctx.clip();
            }

            ctx.rotate(p.pitch);

            if (activeFrame) {
                const targetH = 108;
                const aspect = activeFrame.width / Math.max(1, activeFrame.height);
                const targetW = targetH * aspect;
                ctx.drawImage(activeFrame, -targetW * 0.5, -targetH + 6, targetW, targetH);
            }

            if (p.shieldTimer > 0) {
                ctx.strokeStyle = 'rgba(250, 204, 21, 0.85)';
                ctx.lineWidth = 3;
                ctx.setLineDash([7, 5]);
                ctx.beginPath();
                ctx.ellipse(2, -46, 52, 54, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            ctx.restore();
            ctx.globalAlpha = 1;
        }

        drawObstacle(ctx, obs) {
            ctx.save();
            const hop = (obs.kind === 'chicken' || obs.kind === 'dog')
                ? Math.abs(Math.sin(obs.animPhase * 1.4)) * 7
                : Math.sin(obs.animPhase) * 1.5;

            ctx.fillStyle = 'rgba(15, 23, 42, 0.3)';
            ctx.beginPath();
            ctx.ellipse(obs.x, obs.y + 14, obs.width * 0.45, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.translate(obs.x, obs.y + 12 - hop);

            if (obs.kind === 'chicken') {
                ctx.fillStyle = '#fef9c3';
                ctx.beginPath();
                ctx.ellipse(0, -12, 14, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(11, -21, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(11, -28, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.moveTo(17, -21);
                ctx.lineTo(23, -19);
                ctx.lineTo(17, -17);
                ctx.closePath();
                ctx.fill();
            } else if (obs.kind === 'dog') {
                ctx.fillStyle = '#b45309';
                ctx.beginPath();
                ctx.roundRect(-18, -22, 30, 14, 6);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(12, -26, 8.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#78350f';
                ctx.beginPath();
                ctx.ellipse(10, -31, 4, 7, -0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#92400e';
                ctx.fillRect(-14, -9, 4, 9);
                ctx.fillRect(5, -9, 4, 9);
            } else if (obs.kind === 'scooter') {
                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.arc(-22, -8, 9, 0, Math.PI * 2);
                ctx.arc(22, -8, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.roundRect(-26, -26, 52, 16, 6);
                ctx.fill();
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.roundRect(-22, -38, 24, 13, 4);
                ctx.fill();
                ctx.fillStyle = '#f1c29b';
                ctx.beginPath();
                ctx.arc(8, -42, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fde047';
                ctx.beginPath();
                ctx.moveTo(0, -45);
                ctx.lineTo(18, -45);
                ctx.lineTo(9, -54);
                ctx.closePath();
                ctx.fill();
            } else if (obs.kind === 'vendor') {
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.roundRect(-12, -34, 22, 22, 5);
                ctx.fill();
                ctx.fillStyle = '#f1c29b';
                ctx.beginPath();
                ctx.arc(-1, -42, 7.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#eab308';
                ctx.beginPath();
                ctx.moveTo(-16, -46);
                ctx.lineTo(14, -46);
                ctx.lineTo(-1, -55);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#92400e';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-28, -28);
                ctx.lineTo(26, -28);
                ctx.stroke();
                ctx.fillStyle = '#a16207';
                ctx.fillRect(-33, -24, 12, 11);
                ctx.fillRect(20, -24, 12, 11);
            } else {
                ctx.fillStyle = '#b45309';
                ctx.strokeStyle = '#78350f';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(-22, -28, 44, 26, 5);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(-20, -15);
                ctx.lineTo(20, -15);
                ctx.moveTo(0, -28);
                ctx.moveTo(0, -2);
                ctx.stroke();
            }

            if (obs.scaredTimer > 0) {
                ctx.fillStyle = '#fef08a';
                ctx.font = '900 13px Nunito, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('!', 0, -58);
            }

            ctx.restore();
        }

        drawCollectible(ctx, col) {
            const bobY = col.y - col.z + Math.sin(col.bobPhase) * 6 + 6;

            ctx.save();
            ctx.fillStyle = 'rgba(250, 204, 21, 0.24)';
            ctx.beginPath();
            ctx.arc(col.x, bobY, 22, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = '26px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const emojiMap = {
                banh_mi: '🥖',
                pho: '🍜',
                coffee: '☕',
                non_la: '👒'
            };
            ctx.fillText(emojiMap[col.kind] || '🥖', col.x, bobY);
            ctx.restore();
        }

        loop(timestamp) {
            if (!this.lastTimestamp) this.lastTimestamp = timestamp;
            const dt = Math.min(0.05, Math.max(0.001, (timestamp - this.lastTimestamp) / 1000));
            this.lastTimestamp = timestamp;

            this.update(dt);
            this.draw();

            requestAnimationFrame((ts) => this.loop(ts));
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        window.gameInstance = new LudoSideScrollerGame();
    });
    </script>
